name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check

      - name: Format
        run: ruff format --check

      - name: Test (MockLLM, no API key needed)
        run: pytest

      - name: Offline demo runs end to end
        run: python examples/01_offline_demo.py
